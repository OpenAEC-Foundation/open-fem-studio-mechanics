name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open FEM Studio Mechanics is about structural mechanics: modelling, loads, analysis and results.
        Code checking (Eurocode member checks) is out of scope for this edition.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: Describe the problem or the workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: references
    attributes:
      label: References
      description: Theory, benchmarks or examples that show the expected behaviour or results.
